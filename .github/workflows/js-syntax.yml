name: JS syntax

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check modules and test scripts with node --check
        run: |
          fail=0
          echo "## JS syntax" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .ci-tmp
          # App files are ES modules: check them as .mjs; test scripts are CommonJS
          for f in js/*.js test/*.js; do
            case "$f" in
              js/*) check=".ci-tmp/$(basename "$f" .js).mjs"; cp "$f" "$check" ;;
              *) check="$f" ;;
            esac
            if out=$(node --check "$check" 2>&1); then
              echo "OK $f"
              echo "- :white_check_mark: \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error file=$f::$out"
              {
                echo "- :x: \`$f\`"
                echo ""
                echo '  ```'
                echo "$out" | sed 's/^/  /'
                echo '  ```'
              } >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
